<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuchuPuchu Trends</title>
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff5f7;
        }
        
        /* Top Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #ffffff;
            box-shadow: 0 2px 10px rgba(255, 64, 129, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .brand-logo {
            font-size: 20px;
            font-weight: 800;
            color: #ff4081;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .brand-logo span {
            color: #333;
        }

        /* Header Banner */
        header {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            text-align: center;
            padding: 25px 15px;
            margin: 15px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.3);
            position: relative;
        }
        header h1 {
            margin: 0;
            font-size: 19px;
            white-space: nowrap;
        }
        header p {
            margin: 8px 0 12px;
            font-size: 13px;
            opacity: 0.95;
        }

        /* Aesthetic Cute Voice Button */
        .voice-btn {
            background-color: #ffffff;
            color: #ff4081;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .voice-btn:hover {
            background-color: #fff0f3;
            transform: scale(1.05);
        }

        /* Category Filter Buttons */
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px 15px 20px;
        }
        .categories button {
            padding: 9px 18px;
            border: none;
            background-color: #ffffff;
            color: #ff4081;
            cursor: pointer;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: 0.3s ease;
        }
        .categories button.active, .categories button:hover {
            background-color: #ff4081;
            color: white;
            transform: translateY(-2px);
        }

        /* Product Grid Layout */
        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
            padding: 0 15px 40px;
            max-width: 900px;
            margin: auto;
        }
        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.08);
            text-align: center;
            padding-bottom: 15px;
            transition: 0.3s;
            border: 1px solid #ffe6eb;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 64, 129, 0.15);
        }
        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid #ffe6eb;
        }
        .product-card h3 {
            font-size: 14px;
            margin: 12px 10px 5px;
            color: #333;
            padding: 0 5px;
        }
        .product-card p {
            color: #ff4081;
            font-weight: bold;
            font-size: 16px;
            margin: 0 0 12px;
        }
        
        /* View Button inside Card */
        .view-btn {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .view-btn:hover {
            background-color: #e03570;
        }

        /* Modals (Popups) Styling - Fixed for Perfect Centering & Fit */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: white;
            padding: 15px;
            border-radius: 16px;
            width: 100%;
            max-width: 330px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            position: relative;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
            margin: auto;
        }
        /* Fixed Image Size inside Popup so it doesn't overflow */
        .modal-content img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            background-color: #fff5f7;
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .modal-content h2 {
            color: #ff4081;
            font-size: 15px;
            margin: 5px 0;
        }
        .modal-content p {
            color: #333;
            font-size: 12px;
            margin: 5px 0 10px;
            text-align: left;
        }
        .modal-content label {
            font-size: 11px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-top: 8px;
            text-align: left;
        }
        .modal-content input, .modal-content textarea, .modal-content select {
            width: 100%;
            padding: 7px;
            margin-top: 3px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 13px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .submit-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 20px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
            font-size: 13px;
        }
        .close-btn {
            background-color: #ccc;
            color: #333;
            border: none;
            padding: 9px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            width: 90px;
        }
    </style>
</head>
<body>

    <!-- Hidden Audio Element -->
    <audio id="kuchuAudio" src="kuchu-puchu.mp3"></audio>

    <!-- Navbar -->
    <div class="navbar">
        <div class="brand-logo">
            🛍️ KuchuPuchu <span>Trends</span>
        </div>
    </div>

    <!-- Main Banner -->
    <header>
        <h1>✨ Welcome to KuchuPuchu Trends ✨</h1>
        <p>Cutest treats for your favourite person 💕</p>
        <!-- Aesthetic Cute Voice Play Button -->
        <button class="voice-btn" onclick="playVoice()">
            🎧 Tap to Play Message
        </button>
    </header>

    <!-- Categories Bar -->
    <div class="categories">
        <button class="active" onclick="filterProducts('all', event)">All</button>
        <button onclick="filterProducts('accessory', event)">Accessories</button>
        <button onclick="filterProducts('dress', event)">Dresses</button>
    </div>

    <!-- Product Grid -->
    <div class="product-container" id="productGrid">
        <!-- Product 1: Kashmiri Ghungroo Bangles -->
        <div class="product-card" data-category="accessory" onclick="openDetailModal('Trending Kashmiri Ghungroo with Nag Bangles (Light Multi Color)', '₹ 249', 'https://i.ibb.co/fYJYzrVJ/Screenshot-2026-0913-191612.png', 'Stone Type: Cubic Zirconia/American Diamond\nPlating: No Plating\nSizing: Non-Adjustable\nOccasion: Ethnic Party\nColor: Multicolor\nNet Quantity: 1')">
            <img src="https://i.ibb.co/fYJYzrVJ/Screenshot-2026-0913-191612.png" alt="Kashmiri Ghungroo Bangles">
            <h3>Trending Kashmiri Ghungroo Bangles</h3>
            <p>₹ 249</p>
            <button class="view-btn">View Product</button>
        </div>
    </div>

    <!-- Step 1: Big Product Details Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <img id="detailImg" src="" alt="Product Image">
            <h2 id="detailTitle"></h2>
            <p id="detailPrice" style="color: #ff4081; font-weight: bold; font-size: 16px; text-align: center; margin: 5px 0;"></p>
            <p id="detailDesc" style="white-space: pre-line; background: #fff5f7; padding: 8px; border-radius: 8px; font-size: 11px;"></p>
            
            <div class="modal-buttons">
                <button type="button" class="close-btn" onclick="closeDetailModal()">Close</button>
                <button type="button" class="submit-whatsapp" style="background-color: #ff4081;" onclick="openOrderForm()">Order Now</button>
            </div>
        </div>
    </div>

    <!-- Step 2: Order Form Modal with Size & Quantity -->
    <div id="orderModal" class="modal">
        <div class="modal-content" style="text-align: left;">
            <h2 id="modalProductTitle" style="text-align: center; font-size: 15px;">Enter Order Details</h2>
            <form id="whatsappForm" onsubmit="sendToWhatsApp(event)">
                <label>Select Size:</label>
                <select id="custSize" required>
                    <option value="" disabled selected>Choose your size</option>
                    <option value="2.2">2.2</option>
                    <option value="2.4">2.4</option>
                    <option value="2.6">2.6</option>
                    <option value="2.8">2.8</option>
                </select>

                <label>Quantity (Max 20):</label>
                <input type="number" id="custQty" min="1" max="20" value="1" required>

                <label>Your Name:</label>
                <input type="text" id="custName" required placeholder="Enter your full name">

                <label>Mobile Number:</label>
                <input type="tel" id="custMobile" required placeholder="Enter mobile number">

                <label>Delivery Address:</label>
                <textarea id="custAddress" rows="2" required placeholder="House No, Street, City"></textarea>

                <label>Pin Code:</label>
                <input type="text" id="custPincode" required placeholder="Pin Code">

                <div class="modal-buttons">
                    <button type="button" class="close-btn" onclick="closeOrderModal()">Back</button>
                    <button type="submit" class="submit-whatsapp">Send on WhatsApp</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Audio Play Function
        function playVoice() {
            let audio = document.getElementById('kuchuAudio');
            audio.play().catch(error => {
                alert("Please tap again to play audio!");
            });
        }

        let currentProduct = "";
        let currentPrice = "";

        function openDetailModal(name, price, img, desc) {
            currentProduct = name;
            currentPrice = price;
            
            document.getElementById('detailTitle').innerText = name;
            document.getElementById('detailPrice').innerText = price;
            document.getElementById('detailImg').src = img;
            document.getElementById('detailDesc').innerText = desc;
            
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function openOrderForm() {
            closeDetailModal();
            document.getElementById('modalProductTitle').innerText = "Order: " + currentProduct;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function sendToWhatsApp(event) {
            event.preventDefault();
            
            let size = document.getElementById('custSize').value;
            let qty = document.getElementById('custQty').value;
            let name = document.getElementById('custName').value;
            let mobile = document.getElementById('custMobile').value;
            let address = document.getElementById('custAddress').value;
            let pincode = document.getElementById('custPincode').value;

            // अपना WhatsApp नंबर यहाँ डालें (91 के साथ, जैसे 919876543210)
            let myPhoneNumber = "919876543210"; 

            let message = "✨ New Order - KuchuPuchu Trends ✨\n\n" +
                          "📦 Product: " + currentProduct + "\n" +
                          "💰 Price: " + currentPrice + "\n" +
                          "📏 Size: " + size + "\n" +
                          "🔢 Quantity: " + qty + "\n\n" +
                          "👤 Name: " + name + "\n" +
                          "📞 Mobile: " + mobile + "\n" +
                          "🏠 Address: " + address + "\n" +
                          "📍 Pin Code: " + pincode;

            let url = "https://wa.me/" + myPhoneNumber + "?text=" + encodeURIComponent(message);
            window.open(url, '_blank');
            closeOrderModal();
        }

        function filterProducts(category, event) {
            let buttons = document.querySelectorAll('.categories button');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            let products = document.querySelectorAll('.product-card');
            products.forEach(product => {
                if (category === 'all' || product.getAttribute('data-category') === category) {
                    product.style.display = 'block';
                } else {
                    product.style.display = 'none';
                }
            });
        }
    </script>

</body>
</html>
