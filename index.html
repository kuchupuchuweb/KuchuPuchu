<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuchuPuchu Trends</title>
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff5f7;
        }
        
        /* Top Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #ffffff;
            box-shadow: 0 2px 10px rgba(255, 64, 129, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .brand-logo {
            font-size: 20px;
            font-weight: 800;
            color: #ff4081;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .brand-logo span {
            color: #333;
        }

        /* Header Banner */
        header {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            text-align: center;
            padding: 25px 15px;
            margin: 15px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.3);
            position: relative;
        }
        header h1 {
            margin: 0;
            font-size: 19px;
            white-space: nowrap;
        }
        header p {
            margin: 8px 0 12px;
            font-size: 13px;
            opacity: 0.95;
        }

        /* Aesthetic Cute Voice Button */
        .voice-btn {
            background-color: #ffffff;
            color: #ff4081;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .voice-btn:hover {
            background-color: #fff0f3;
            transform: scale(1.05);
        }

        /* Category Filter Buttons */
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px 15px 20px;
        }
        .categories button {
            padding: 8px 16px;
            border: none;
            background-color: #ffffff;
            color: #ff4081;
            cursor: pointer;
            border-radius: 25px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: 0.3s ease;
        }
        .categories button.active, .categories button:hover {
            background-color: #ff4081;
            color: white;
            transform: translateY(-2px);
        }

        /* Product Grid Layout (2 items per row) */
        .product-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 12px 40px;
            max-width: 600px;
            margin: auto;
        }
        .product-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(255, 64, 129, 0.08);
            text-align: center;
            padding-bottom: 12px;
            transition: 0.3s;
            border: 1px solid #ffe6eb;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(255, 64, 129, 0.15);
        }
        .product-img-box {
            width: 100%;
            height: 160px;
            background-color: #fff5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #ffe6eb;
            overflow: hidden;
        }
        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-card h3 {
            font-size: 13px;
            margin: 8px 8px 4px;
            color: #333;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-card p {
            color: #ff4081;
            font-weight: bold;
            font-size: 14px;
            margin: 0 0 10px;
        }
        
        .view-btn {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin: 0 auto;
            width: 85%;
        }
        .view-btn:hover {
            background-color: #e03570;
        }

        /* MEESHO STYLE FULL-SCREEN / BOTTOM-SHEET MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            align-items: flex-end;
            justify-content: center;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.2);
            position: relative;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        /* Large Product Image Preview & Thumbnails */
        .main-preview-img {
            width: 100%;
            height: 320px;
            object-fit: contain;
            background-color: #fff5f7;
            border-radius: 12px;
            border: 1px solid #ffe6eb;
            margin-bottom: 10px;
        }
        .thumbnail-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .thumbnail-container img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #ddd;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .thumbnail-container img.active-thumb {
            border-color: #ff4081;
            transform: scale(1.05);
        }

        .modal-content h2 {
            color: #222;
            font-size: 18px;
            margin: 10px 0 5px;
        }
        .modal-price {
            color: #ff4081;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 12px;
        }
        .modal-desc-box {
            background: #fff5f7;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            color: #444;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: left;
            white-space: pre-line;
        }
        
        .modal-buttons {
            display: flex;
            gap: 12px;
            position: sticky;
            bottom: 0;
            background: white;
            padding: 10px 0;
            border-top: 1px solid #eee;
        }
        .submit-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }
        .close-btn {
            background-color: #f1f1f1;
            color: #333;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        /* Order Form Inputs Styling */
        .order-form-container label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-top: 10px;
            text-align: left;
        }
        .order-form-container input, .order-form-container textarea, .order-form-container select {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fafafa;
        }
    </style>
</head>
<body>

    <!-- Hidden Audio Element -->
    <audio id="kuchuAudio" src="kuchu-puchu.mp3"></audio>

    <!-- Navbar -->
    <div class="navbar">
        <div class="brand-logo">
            🛍️ KuchuPuchu <span>Trends</span>
        </div>
    </div>

    <!-- Main Banner -->
    <header>
        <h1>✨ Welcome to KuchuPuchu Trends ✨</h1>
        <p>Cutest treats for your favourite person 💕</p>
        <button class="voice-btn" onclick="playVoice()">
            🎧 Tap to Play Message
        </button>
    </header>

    <!-- Categories Bar -->
    <div class="categories">
        <button class="active" onclick="filterProducts('all', event)">All</button>
        <button onclick="filterProducts('accessory', event)">Accessories</button>
        <button onclick="filterProducts('dress', event)">Dresses</button>
    </div>

    <!-- Product Grid (Only 1 product active now) -->
    <div class="product-container" id="productGrid">
        <!-- Product 1: Kashmiri Ghungroo Bangles -->
        <div class="product-card" data-category="accessory" onclick="openDetailModal(
            'Trending Kashmiri Ghungroo with Nag Bangles (Light Multi Color)', 
            '₹ 249', 
            'https://i.ibb.co/fYJYzrVJ/Screenshot-2026-0913-191612.png,https://i.ibb.co/fYJYzrVJ/Screenshot-2026-0913-191612.png', 
            'Stone Type: Cubic Zirconia / American Diamond\nPlating: No Plating\nSizing: Non-Adjustable\nOccasion: Ethnic Party\nColor: Multicolor'
        )">
            <div class="product-img-box">
                <img src="https://i.ibb.co/fYJYzrVJ/Screenshot-2026-0913-191612.png" alt="Kashmiri Ghungroo Bangles">
            </div>
            <h3>Trending Kashmiri Ghungroo Bangles</h3>
            <p>₹ 249</p>
            <button class="view-btn">View Product</button>
        </div>
    </div>

    <!-- Meesho Style Big Product Details Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <!-- Big Main Image -->
            <img id="mainPreviewImg" class="main-preview-img" src="" alt="Product View">
            
            <!-- Thumbnail Gallery for Multiple Photos -->
            <div class="thumbnail-container" id="thumbnailContainer"></div>

            <h2 id="detailTitle"></h2>
            <div id="detailPrice" class="modal-price"></div>
            
            <div style="font-weight: bold; font-size: 13px; text-align: left; margin-bottom: 5px; color: #555;">Product Details:</div>
            <div id="detailDesc" class="modal-desc-box"></div>
            
            <div class="modal-buttons">
                <button type="button" class="close-btn" onclick="closeDetailModal()">Close</button>
                <button type="button" class="submit-whatsapp" style="background-color: #ff4081;" onclick="openOrderForm()">Order Now</button>
            </div>
        </div>
    </div>

    <!-- Order Form Modal (Meesho Style Bottom Sheet) -->
    <div id="orderModal" class="modal">
        <div class="modal-content order-form-container">
            <h2 id="modalProductTitle" style="text-align: center; font-size: 16px; color: #ff4081; margin-bottom: 15px;">Enter Order Details</h2>
            <form id="whatsappForm" onsubmit="sendToWhatsApp(event)">
                <label>Select Size:</label>
                <select id="custSize" required>
                    <option value="" disabled selected>Choose your size</option>
                    <option value="2.2">2.2</option>
                    <option value="2.4">2.4</option>
                    <option value="2.6">2.6</option>
                    <option value="2.8">2.8</option>
                </select>

                <label>Quantity (Max 20):</label>
                <input type="number" id="custQty" min="1" max="20" value="1" required>

                <label>Your Name:</label>
                <input type="text" id="custName" required placeholder="Enter your full name">

                <label>Mobile Number:</label>
                <input type="tel" id="custMobile" required placeholder="Enter mobile number">

                <label>Delivery Address:</label>
                <textarea id="custAddress" rows="2" required placeholder="House No, Street, City"></textarea>

                <label>Pin Code:</label>
                <input type="text" id="custPincode" required placeholder="Pin Code">

                <div class="modal-buttons" style="margin-top: 20px;">
                    <button type="button" class="close-btn" onclick="closeOrderForm()">Back</button>
                    <button type="submit" class="submit-whatsapp">Send on WhatsApp</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function playVoice() {
            let audio = document.getElementById('kuchuAudio');
            audio.play().catch(error => {
                alert("Please tap again to play audio!");
            });
        }

        let currentProduct = "";
        let currentPrice = "";
        let currentImgUrl = ""; 

        function openDetailModal(name, price, imgString, desc) {
            currentProduct = name;
            currentPrice = price;
            
            document.getElementById('detailTitle').innerText = name;
            document.getElementById('detailPrice').innerText = price;
            document.getElementById('detailDesc').innerText = desc;
            
            let images = imgString.split(',');
            let mainImg = document.getElementById('mainPreviewImg');
            let thumbContainer = document.getElementById('thumbnailContainer');
            
            thumbContainer.innerHTML = '';
            mainImg.src = images[0].trim();
            currentImgUrl = images[0].trim(); 

            images.forEach((imgUrl, index) => {
                let thumb = document.createElement('img');
                let cleanUrl = imgUrl.trim();
                thumb.src = cleanUrl;
                if(index === 0) thumb.classList.add('active-thumb');
                
                thumb.onclick = function() {
                    mainImg.src = cleanUrl;
                    currentImgUrl = cleanUrl; 
                    let allThumbs = thumbContainer.querySelectorAll('img');
                    allThumbs.forEach(t => t.classList.remove('active-thumb'));
                    thumb.classList.add('active-thumb');
                };
                thumbContainer.appendChild(thumb);
            });
            
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function openOrderForm() {
            closeDetailModal();
            document.getElementById('modalProductTitle').innerText = "Order: " + currentProduct;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderForm() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function sendToWhatsApp(event) {
            event.preventDefault();
            
            let size = document.getElementById('custSize').value;
            let qty = document.getElementById('custQty').value;
            let name = document.getElementById('custName').value;
            let mobile = document.getElementById('custMobile').value;
            let address = document.getElementById('custAddress').value;
            let pincode = document.getElementById('custPincode').value;

            let myPhoneNumber = "918852839726"; 

            let message = "✨ New Order - KuchuPuchu Trends ✨\n\n" +
                          "📦 Product: " + currentProduct + "\n" +
                          "💰 Price: " + currentPrice + "\n" +
                          "🖼️ Photo Link: " + currentImgUrl + "\n\n" +
                          "📏 Size: " + size + "\n" +
                          "🔢 Quantity: " + qty + "\n\n" +
                          "👤 Name: " + name + "\n" +
                          "📞 Mobile: " + mobile + "\n" +
                          "🏠 Address: " + address + "\n" +
                          "📍 Pin Code: " + pincode;

            let url = "https://wa.me/" + myPhoneNumber + "?text=" + encodeURIComponent(message);
            window.open(url, '_blank');
            closeOrderForm();
        }

        function filterProducts(category, event) {
            let buttons = document.querySelectorAll('.categories button');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            let products = document.querySelectorAll('.product-card');
            products.forEach(product => {
                if (category === 'all' || product.getAttribute('data-category') === category) {
                    product.style.display = 'flex';
                } else {
                    product.style.display = 'none';
                }
            });
        }
    </script>

</body>
</html>
